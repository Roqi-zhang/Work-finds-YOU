<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>05 Delivery · Timeline Journal · C</title>
<link rel="stylesheet" href="./_shared.css" />
<script src="./_data.js"></script>
<script src="./_shared.js"></script>
<style>
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
  .head h1 { font-size: 88px; font-weight: 500; letter-spacing: -0.035em; line-height: 0.9; color: var(--ink-strong); }
  .head p { max-width: 36ch; opacity: .8; font-size: 14px; }

  .top-tools {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-top: 0.5px solid var(--line); border-bottom: 0.5px solid var(--line);
    margin-bottom: 48px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  }
  .top-tools .l { display: flex; gap: 28px; align-items: center; }
  .top-tools .l a { border-bottom: 0.5px solid var(--ink-strong); padding-bottom: 2px; }
  .top-tools .r { display: flex; gap: 10px; align-items: center; }
  .icon-btn { width: 30px; height: 30px; border-radius: 50%; border: 0.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; transition: all .3s var(--ease); }
  .icon-btn:hover { border-color: var(--ink-strong); color: var(--ink-strong); }

  .journal { display: grid; grid-template-columns: 1fr 320px; gap: 64px; align-items: start; }

  .entries { display: flex; flex-direction: column; }
  .entry {
    padding: 40px 0; border-top: 0.5px solid var(--line);
    display: grid; grid-template-columns: 96px 1fr; gap: 32px;
  }
  .entry .date {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; opacity: .55;
    line-height: 1.6;
  }
  .entry .date .d { display: block; font-size: 34px; color: var(--ink-strong); letter-spacing: -0.02em; margin-bottom: 4px; font-family: inherit; opacity: 1; }
  .entry .body { }
  .entry h2 {
    font-size: 30px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.15; color: var(--ink-strong);
    margin-bottom: 4px;
  }
  .entry .sub { font-size: 13px; opacity: .7; letter-spacing: 0.02em; margin-bottom: 20px; }
  .entry .sub .mark { margin-left: 10px; }
  .entry p { font-size: 15px; max-width: 62ch; line-height: 1.7; }
  .entry .quote {
    border-left: 0.5px solid var(--ink); padding-left: 18px; margin: 18px 0;
    font-size: 15px; opacity: .8; font-style: italic;
  }
  .entry .foot {
    display: flex; gap: 20px; margin-top: 20px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: .6;
  }
  .entry .foot a { border-bottom: 0.5px solid var(--line); padding-bottom: 2px; }
  .entry .foot a:hover { color: var(--ink-strong); border-color: var(--ink-strong); }

  /* right rail vertical timeline */
  .rail {
    position: sticky; top: 32px;
    border-left: 0.5px solid var(--line);
    padding: 8px 0 8px 24px;
    height: 720px;
    display: flex; flex-direction: column; gap: 22px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  }
  .rail .caption { position: absolute; left: 24px; top: -22px; }
  .rail .dot { position: relative; display: flex; align-items: center; gap: 12px; opacity: .55; transition: opacity .3s var(--ease); }
  .rail .dot::before {
    content: ""; position: absolute; left: -27px; top: 6px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--paper); border: 0.5px solid var(--ink);
  }
  .rail .dot.on { opacity: 1; color: var(--ink-strong); }
  .rail .dot.on::before { background: var(--ink-strong); border-color: var(--ink-strong); }
  .rail .dot .m { flex: 1; opacity: .8; }
  .rail .dot .t { font-size: 9px; opacity: .5; }

  .stats {
    margin-top: 40px; padding-top: 24px; border-top: 0.5px solid var(--line);
    display: flex; flex-direction: column; gap: 14px;
  }
  .stats .r { display: flex; justify-content: space-between; font-size: 12px; }
  .stats .r span:last-child { font-family: "JetBrains Mono", ui-monospace, monospace; color: var(--ink-strong); }

  /* status dropdown (swiss, no native chrome) */
  .status-row { display: flex; align-items: center; gap: 12px; margin: 10px 0 12px; }
  .status-row .lb { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; opacity: .5;
    font-family: "JetBrains Mono", ui-monospace, monospace; }
  .status-sel { position: relative; display: inline-block; }
  .status-sel select {
    appearance: none; -webkit-appearance: none; background: transparent; color: inherit;
    border: 0.5px solid var(--line); border-radius: 0; padding: 6px 30px 6px 12px;
    font: inherit; font-size: 12px; letter-spacing: 0.06em; cursor: pointer;
    transition: border-color .3s var(--ease);
  }
  .status-sel select:hover, .status-sel select:focus { border-color: var(--ink-strong); outline: none; }
  .status-sel::after {
    content: "↓"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-size: 10px; opacity: .5; pointer-events: none;
  }

  .entry .foot button {
    background: none; border: none; padding: 0 0 2px; font: inherit;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    border-bottom: 0.5px solid var(--line); cursor: pointer; color: inherit;
  }
  .entry .foot button:hover { color: var(--ink-strong); border-color: var(--ink-strong); }
  .entry.editing h2, .entry.editing p, .entry.editing .quote, .entry.editing .sub {
    outline: 0.5px dashed var(--line); outline-offset: 6px;
  }
  .entry.editing [contenteditable]:focus { outline-color: var(--ink-strong); outline-style: solid; }
</style>

</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="logo">Work Finds You / 工作找你</div>
    <nav>
      <a href="./home.html">01 Home</a>
      <a href="./profile.html">02 Profile</a>
      <a href="./jobprofile.html">03 Job</a>
      <a href="./match.html">04 Match</a>
      <a href="./compare.html">05 Compare</a>
      <a href="./delivery.html" class="on">06 Delivery</a>
    </nav>
    <div class="right">
      <span class="caption">Journal · 07·12</span>
      <button class="theme-toggle"></button>
    </div>
  </header>

  <div class="head">
    <div>
      <div class="caption">05 · Delivery</div>
      <h1 style="margin-top:16px;">The<br/>Job Journal.</h1>
    </div>
    <p>一份倒序阅读的求职日志。每一次投递、拒信、面试都是一段带小标题的段落；右侧竖轨记录状态变化的时间打点。</p>
  </div>

  <div class="top-tools">
    <div class="l">
      <a href="#">+ 新增投递</a>
      <span style="opacity:.5;">View · Journal</span>
      <span style="opacity:.5;">Sort · Newest</span>
    </div>
    <div class="r">
      <span class="caption" style="opacity:.5;">Filter</span>
      <button class="icon-btn" title="filter">
        <svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="0.5"/><line x1="3" y1="6" x2="9" y2="6" stroke="currentColor" stroke-width="0.5"/></svg>
      </button>
      <button class="icon-btn" title="more">
        <svg width="12" height="12" viewBox="0 0 12 12"><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="6" cy="6" r="1" fill="currentColor"/><circle cx="9" cy="6" r="1" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <section class="journal">
    <div class="entries" id="entries"></div>

    <aside class="rail" id="rail">
      <span class="caption">Timeline</span>

      <div class="stats">
        <div class="r"><span>Active</span><span>0</span></div>
        <div class="r"><span>Interview</span><span>0</span></div>
        <div class="r"><span>Offers</span><span>0</span></div>
        <div class="r"><span>Avg match</span><span>—</span></div>
        <div class="r"><span>Cycle</span><span>—</span></div>
      </div>
    </aside>
  </section>

</main>
<a class="preview-crumb" href="./index.html">← Previews</a>

<script>
(function () {
  const STATUSES = WFY.STATUSES;
  const ACTIVE_ON = ["已投递", "面试中"];
  const MON_NAMES = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const entriesEl = document.getElementById("entries");
  const rail = document.getElementById("rail");
  const pad = (n) => String(n).padStart(2, "0");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const parts = (iso) => {
    const d = new Date((iso || "") + "T00:00:00");
    return isNaN(d) ? { d: "--", mon: "---", y: "----", mm: "--", dd: "--" }
      : { d: pad(d.getDate()), mon: MON_NAMES[d.getMonth()], y: d.getFullYear(), mm: pad(d.getMonth() + 1), dd: pad(d.getDate()) };
  };

  /* ---------- entries ---------- */
  function renderEntries() {
    const apps = WFY.getApplications();
    entriesEl.innerHTML = "";

    if (!apps.length) {
      const e = document.createElement("div");
      e.className = "entry";
      e.innerHTML =
        `<div class="date"><span class="d">—</span>NO DATA</div>` +
        `<div class="body"><h2>还没有投递记录</h2>` +
        `<div class="sub">在匹配页点「直接投递」，或在对比池里选中岗位后点「投递」，记录会出现在这里。</div>` +
        `<div class="foot"><a href="./compare.html">去对比池 →</a></div></div>`;
      entriesEl.appendChild(e);
      return;
    }

    apps.forEach((a) => {
      const p = parts(a.appliedAt);
      const el = document.createElement("article");
      el.className = "entry";
      el.dataset.id = a.id;
      el.innerHTML =
        `<div class="date"><span class="d">${p.d}</span>${p.mon} · ${p.y}</div>` +
        `<div class="body">` +
          `<h2>${esc(a.co)} · ${esc(a.title)}</h2>` +
          `<div class="sub">匹配 ${a.m}%</div>` +
          `<p>${esc(a.body)}</p>` +
          (a.quote ? `<div class="quote">${esc(a.quote)}</div>` : "") +
        `</div>`;

      const h2 = el.querySelector("h2");
      const sub = el.querySelector(".sub");
      const body = el.querySelector(".body");

      // status dropdown
      const row = document.createElement("div");
      row.className = "status-row";
      row.innerHTML = `<span class="lb">投递状态</span><span class="status-sel"><select>` +
        STATUSES.map((s) => `<option${s === a.status ? " selected" : ""}>${s}</option>`).join("") +
        `</select></span>`;
      h2.after(row);
      row.querySelector("select").addEventListener("change", (e) => {
        WFY.setStatus(a.id, e.target.value);
        renderRail();
      });

      // actions: 查看匹配 / 编辑
      const foot = document.createElement("div");
      foot.className = "foot";
      foot.innerHTML = `<a href="./match.html?job=${encodeURIComponent(a.id)}">查看匹配</a><button type="button">编辑</button>`;
      body.appendChild(foot);

      const editBtn = foot.querySelector("button");
      editBtn.addEventListener("click", () => {
        const on = el.classList.toggle("editing");
        const p2 = el.querySelector("p");
        let q = el.querySelector(".quote");
        if (on && !q) {                      // allow adding a quote while editing
          q = document.createElement("div");
          q.className = "quote";
          p2.after(q);
        }
        const targets = [h2, p2, q].filter(Boolean);
        targets.forEach((t) => { if (on) t.setAttribute("contenteditable", "true"); else t.removeAttribute("contenteditable"); });
        editBtn.textContent = on ? "完成" : "编辑";
        if (on) { h2.focus(); return; }
        // save plain text only — never innerHTML
        const titleTxt = (h2.textContent || "").split("·");
        WFY.updateApplication(a.id, {
          co: (titleTxt[0] || a.co).trim(),
          title: (titleTxt.slice(1).join("·") || a.title).trim(),
          body: (p2 && p2.textContent) || "",
          quote: (q && q.textContent.trim()) || "",
        });
        renderEntries();
        renderRail();
      });

      entriesEl.appendChild(el);
    });
  }

  /* ---------- timeline rail (derived from the event stream) ---------- */
  function renderRail() {
    const apps = WFY.getApplications();
    const items = [];
    apps.forEach((a) => {
      const seen = {};
      a.events.slice().reverse().forEach((ev) => {   // latest event per status
        if (seen[ev.status]) return;
        seen[ev.status] = 1;
        const p = parts(ev.at);
        items.push({
          id: a.id, label: a.co + " · " + ev.status, at: ev.at,
          on: ACTIVE_ON.indexOf(ev.status) > -1 && a.status === ev.status,
          t: p.mm + "·" + p.dd,
        });
      });
    });
    items.sort((x, y) => (y.at || "").localeCompare(x.at || ""));

    rail.querySelectorAll(".dot").forEach((d) => d.remove());
    const stats = rail.querySelector(".stats");
    items.forEach((it) => {
      const d = document.createElement("div");
      d.className = "dot" + (it.on ? " on" : "");
      d.dataset.id = it.id;
      d.innerHTML = `<span class="m">${esc(it.label)}</span><span class="t">${it.t}</span>`;
      rail.insertBefore(d, stats);
    });

    // stats, all computed
    const active = apps.filter((a) => a.status !== "结束").length;
    const interview = apps.filter((a) => a.status === "面试中").length;
    const offers = apps.filter((a) => a.status === "结束").length;
    const avg = apps.length ? Math.round(apps.reduce((s, a) => s + (a.m || 0), 0) / apps.length) : null;
    let cycle = null;
    const closed = apps.filter((a) => a.status === "结束" && a.appliedAt && a.updatedAt);
    if (closed.length) {
      cycle = Math.round(closed.reduce((s, a) =>
        s + Math.max(0, (new Date(a.updatedAt) - new Date(a.appliedAt)) / 86400000), 0) / closed.length);
    }
    const rows = stats.querySelectorAll(".r");
    const set = (i, v) => { if (rows[i]) rows[i].lastElementChild.textContent = v; };
    set(0, active); set(1, interview); set(2, offers);
    set(3, avg == null ? "—" : avg + "%"); set(4, cycle == null ? "—" : cycle + "d");
  }

  renderEntries();
  renderRail();

  // focus the entry created from match / compare
  const focus = WFY.focusId();
  if (focus) {
    const el = entriesEl.querySelector(`[data-id="${focus}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
})();
</script>
</body>

</html>
